# ==========================================================
#       NanoWakeWord Training Configuration — Hana
# ==========================================================
# Wake word: "Hana" (home assistant)
# Full parameter reference: CONFIGURATION_GUIDE.md
# ==========================================================

model_name: "hana"
output_dir: "./trained_models"

positive_data_path: "./training_data/positive"
negative_data_path: "./training_data/negative"
background_paths: ["./training_data/noise"]
rir_paths: ["./training_data/rir"]

# ============================================================
# Model Architecture
# ============================================================
# LSTM is recommended for short single-word wake words on edge devices.
# Alternatives: dnn (fastest), cnn, transformer (most accurate but slower)
model_type: "lstm"
layer_size: 64
n_blocks: 2
embedding_dim: 128
dropout_prob: 0.3
activation_function: "relu"

# ============================================================
# Loss Function
# ============================================================
margin_pos: 2.0       # Positives must score > sigmoid(2.0) ≈ 0.88
margin_neg: -2.0      # Negatives must score < sigmoid(-2.0) ≈ 0.12

LOSS_BIAS: 0.65

logit_reg_weight: 0.0005
logit_reg_margin: 4.0
logit_min_margin: 1.5

# ============================================================
# Training Settings
# ============================================================
steps: 30000
stabilization_steps: 10000

optimizer_type: "adamw"
learning_rate_max: 0.0008
lr_scheduler_type: "onecycle"
weight_decay: 0.01
momentum: 0.9
num_workers: 0

# ============================================================
# Synthetic Data Generation
# ============================================================
# The pipeline uses TTS to generate diverse voice samples for "Hana".
# Adversarial negatives are phonetically similar words to reduce false positives.
target_phrase: "hana"

data_generation_tasks:

  # -------------------------------------------------------
  # 1. Positive samples — the actual wake word
  # -------------------------------------------------------
  - name: "positive_hana"
    enabled: true
    output_dir: "data/positive"
    num_samples: 2500
    file_prefix: "pos"

    text_source:
      type: "fixed_phrase"
      phrase: "hana"

  - name: "positive_hana_val"
    enabled: true
    output_dir: "data/positive_val"
    num_samples: 2000
    file_prefix: "pos"

    text_source:
      type: "fixed_phrase"
      phrase: "hana"

  # -------------------------------------------------------
  # 2. Word-based adversarial negatives
  #    Generates phonetically varied negatives automatically
  # -------------------------------------------------------
  - name: "adversarial_negatives"
    enabled: true
    output_dir: "data/negative"
    num_samples: 5000
    file_prefix: "neg_auto"

    text_source:
      type: "auto_adversarial"
      base_phrase: "hana"
      include_input_words: true
      include_partial_phrase: true
      multi_word_prob: 0.5
      max_multi_word_len: 3

  # -------------------------------------------------------
  # 3. Phoneme adversarial negatives
  #    Targets words that sound close to "Hana"
  # -------------------------------------------------------
  - name: "phoneme_hard_negatives"
    enabled: true
    output_dir: "data/negative_phoneme"
    num_samples: 3000
    file_prefix: "neg_ph"

    text_source:
      type: "phoneme_adversarial"
      base_phrase: "hana"
      min_distance: 0.3

  # -------------------------------------------------------
  # 4. Custom hard negatives — words that sound like "Hana"
  # -------------------------------------------------------
  - name: "custom_hard_negatives"
    enabled: true
    output_dir: "data/negative"
    num_samples: 50
    file_prefix: "neg_custom"

    text_source:
      type: "from_list"
      phrases:
        - "hannah"
        - "anna"
        - "ana"
        - "nana"
        - "lana"
        - "dana"
        - "jana"
        - "banana"
        - "montana"
        - "savanna"
        - "indiana"
        - "johanna"
      repeat_each: 10

# ============================================================
# Feature Manifest
# ============================================================
feature_manifest:
  targets:
    t: "./trained_models/hana/features/positive_features.npy"

  negatives:
    n: "./trained_models/hana/features/negative_features.npy"
    hn: "./trained_models/hana/features/hard_negative_features.npy"

  targets_val:
    t_v: "./trained_models/hana/features/positive_features_val.npy"

  negatives_val:
    n_v: "./trained_models/hana/features/negative_features.npy"

# ============================================================
# Batch Composition
# ============================================================
batch_composition:
  n: 100
  hn: 20
  t: 50

# ============================================================
# Augmentation
# ============================================================
augmentation_batch_size: 16
feature_gen_cpu_ratio: 1.0

augmentation_settings:
  gain_prob: 1.0
  max_gain_in_db: 2.0
  min_gain_in_db: -2.0
  max_pitch_semitones: 1.0
  min_pitch_semitones: -1.0
  max_snr_in_db: 35.0
  min_snr_in_db: 15.0
  pitch_prob: 0.3
  rir_prob: 0.0   # Set to 0.3-0.5 if you add RIR files to training_data/rir/

feature_generation_manifest:

  pos_features:
    input_audio_dirs: ["./data/positive"]
    output_filename: "positive_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 10

  pos_val_features:
    input_audio_dirs: ["./data/positive_val"]
    output_filename: "positive_features_val.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 10

  neg_features:
    input_audio_dirs: ["./data/negative"]
    output_filename: "negative_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 10

  hard_neg_features:
    input_audio_dirs: ["./data/negative_phoneme"]
    output_filename: "hard_negative_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 1

background_paths_duplication_rate:
  - 1

# ============================================================
# Validation Settings
# ============================================================
# Miss weight is higher — we'd rather have a false alarm than miss "Hana"
val_miss_weight: 4.0
val_fp_weight: 1.0
validation_batch_size: 256
validation_smoothing_window: 3
val_early_stopping_patience: 5000

# ============================================================
# Curriculum Learning
# ============================================================
hardness_ema_alpha: 0.05
hardness_floor: 0.05
hardness_reset_interval: 5000
hardness_reset_decay: 0.5
checkpoint_averaging_top_k: 5

# ============================================================
# Checkpointing & Debug
# ============================================================
checkpointing:
  enabled: true
  interval_steps: 1000
  limit: 2

early_stopping_patience: 0
min_delta: 0.0001
ema_alpha: 0.01

onnx_opset_version: 17
show_training_summary: true
debug_mode: false

# ============================================================
# Pipeline Control
# ============================================================
transform_clips: true
generate_clips: true
train_model: true
overwrite: true
